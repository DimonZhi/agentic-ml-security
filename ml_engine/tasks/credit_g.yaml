# Постановка задачи. Пишет DS-человек (или заказчик), агент её только читает.
# Всё, что здесь задано, агент в конфиге изменить не может: движок отклонит
# предложение, где таргет, данные или обязательные запреты отличаются.
id: credit-g-001
description: >
  Скоринг заявок на кредит: вероятность, что заёмщик окажется плохим (target=1).
  Модель для ранжирования заявок, основная метрика ROC-AUC.
type: binary
data:
  train: data/train.parquet
  train_sha256: ca3393e3f031c0aebd6b2876ac72c7d4eac132eb5aa837437630a5defa05b359
  label: target
  positive_class: 1
features:
  forbidden_columns: [personal_status, foreign_worker]   # обязательные запреты, агент может только добавить
metric:
  eval_metric: roc_auc
limits:
  max_time_limit_sec: 600
  allowed_families: [GBM, CAT, XGB]
gates:                       # пороги задаёт человек, агент их не меняет
  max_holdout_evaluations: 5
  min_holdout_roc_auc: 0.70
  baseline_run_id: null
  min_gain_over_baseline: 0.0
  max_val_holdout_gap: 0.10
  max_single_feature_auc: 0.90
mlflow:
  experiment: credit-g
